// 1. 【彻底移除】group/version 声明（Flutter 插件由 pubspec.yaml 管理版本）
// 2. 【升级语法】使用声明式插件配置
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "me.yohom.amap_map_fluttify"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        main.jniLibs.srcDir "libs" // 保留原生库路径配置
    }

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable "InvalidPackage"
    }

    packaging {
        resources {
            // 修正 merges 语法（Gradle 8.0+ 兼容写法）
            merges += [
                "res/values/values.xml",
                "AndroidManifest.xml",
                "R.txt",
                "classes.jar",
                "proguard.txt"
            ]
        }
    }

    buildTypes {
        release {
            consumerProguardFiles "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
    
    // 修正项目依赖语法（关键修改！）
    compileOnly project(path: ":foundation_fluttify", configuration: "default")
    
    api "com.amap.api:3dmap:9.2.1" // 高德地图3D SDK
}